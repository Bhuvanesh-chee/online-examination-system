# ---------- MySQL configuration ----------
spring.datasource.url=jdbc:mysql://localhost:3306/exam_portal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080
# session timeout: 20 minute exam + buffer
server.servlet.session.timeout=45m

# allow the Next.js / plain HTML frontend to call the API with cookies
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500
